name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write # requis par actions/attest-build-provenance — porte humaine nommée (plan Task 1.3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install syft + cosign
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          go install github.com/sigstore/cosign/v2/cmd/cosign@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "PATH=$PATH" >> $GITHUB_ENV
          syft version
          cosign version
      - name: install goreleaser
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "PATH=$PATH" >> $GITHUB_ENV
          goreleaser --version
      - name: check
        run: goreleaser check
      - name: verify
        env:
          CGO_ENABLED: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglfw3-dev xorg-dev libwayland-dev pkg-config libxkbcommon-dev
          set +e
          out=$(sh .githooks/run-gates.sh 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ $rc -ne 0 ]; then
            if [ $rc -eq 2 ] && printf '%s' "$out" | grep -E 'SKIP[[:space:]]+frozen' >/dev/null && ! printf '%s' "$out" | grep -q 'FAIL'; then
              echo "frozen gate: named host-only skip (corpus absent in fresh clone) — accepted"
              exit 0
            fi
            echo "gates failed (rc=$rc)" >&2
            exit 1
          fi
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
      - name: SBOM per module pur (docs/deploy.md 7.3.1)
        run: |
          mkdir -p dist
          for m in model metrics results figures qdisc; do
            if [ -d "modules/$m" ]; then d="modules/$m"; else d="$m"; fi
            syft "$d" --output "cyclonedx-json=dist/cgo-$m.sbom.json" --enrich all
          done
          ls -lh dist/*.sbom.json
      - name: publish SBOMs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.sbom.json
      - name: provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-checksums: dist/checksums.txt
      - name: cosign attest digest
        env:
          CGO_IMAGE_DIGEST: ${{ secrets.CGO_IMAGE_DIGEST }}
        run: |
          if [ -n "$CGO_IMAGE_DIGEST" ]; then
            cosign attest-blob --bundle dist/digests.txt.sigstore.json --yes dist/digests.txt || true
            echo "digest pinned: $CGO_IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY
          fi
