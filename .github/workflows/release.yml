name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install syft + cosign
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          go install github.com/sigstore/cosign/v2/cmd/cosign@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "PATH=$PATH" >> $GITHUB_ENV
          syft version
          cosign version
      - name: install goreleaser
        run: |
          curl -sSfL https://github.com/goreleaser/goreleaser/releases/download/v2.11.0/goreleaser_2.11.0_Linux_x86_64.tar.gz -o goreleaser.tar.gz
          tar -xzf goreleaser.tar.gz goreleaser
          sudo mv goreleaser /usr/local/bin/ && goreleaser --version
      - name: check
        run: goreleaser check
      - name: verify
        run: python tools/verify.py
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
      - name: SBOM per module pur (docs/deploy.md 7.3.1)
        run: |
          mkdir -p dist
          for m in model metrics results figures qdisc; do
            syft "modules/$m" --output "cyclonedx-json=dist/cgo-$m.sbom.json" --enrich all
          done
          ls -lh dist/*.sbom.json
      - name: publish SBOMs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.sbom.json
      - name: cosign attest digest
        env:
          CGO_IMAGE_DIGEST: ${{ secrets.CGO_IMAGE_DIGEST }}
        run: |
          if [ -n "$CGO_IMAGE_DIGEST" ]; then
            cosign attest-blob --bundle dist/digests.txt.sigstore.json --yes dist/digests.txt || true
            echo "digest pinned: $CGO_IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY
          fi
