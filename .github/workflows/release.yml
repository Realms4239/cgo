name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install syft + cosign
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          go install github.com/sigstore/cosign/v2/cmd/cosign@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "PATH=$PATH" >> $GITHUB_ENV
          syft version
          cosign version
      - name: install goreleaser
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "PATH=$PATH" >> $GITHUB_ENV
          goreleaser --version
      - name: check
        run: goreleaser check
      - name: verify
        env:
          CGO_ENABLED: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglfw3-dev xorg-dev libwayland-dev pkg-config libxkbcommon-dev
          python tools/verify.py --only hygiene --only links --only exit
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
      - name: SBOM per module pur (docs/deploy.md 7.3.1)
        run: |
          mkdir -p dist
          for m in model metrics results figures qdisc; do
            if [ -d "modules/$m" ]; then d="modules/$m"; else d="$m"; fi
            syft "$d" --output "cyclonedx-json=dist/cgo-$m.sbom.json" --enrich all
          done
          ls -lh dist/*.sbom.json
      - name: publish SBOMs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.sbom.json
      - name: cosign attest digest
        env:
          CGO_IMAGE_DIGEST: ${{ secrets.CGO_IMAGE_DIGEST }}
        run: |
          if [ -n "$CGO_IMAGE_DIGEST" ]; then
            cosign attest-blob --bundle dist/digests.txt.sigstore.json --yes dist/digests.txt || true
            echo "digest pinned: $CGO_IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY
          fi
