name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gates (frozen-skip acceptance)
        run: |
          set +e
          out=$(sh .githooks/run-gates.sh 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ $rc -ne 0 ]; then
            if [ $rc -eq 2 ] && printf '%s' "$out" | grep -E 'SKIP[[:space:]]+frozen' >/dev/null && ! printf '%s' "$out" | grep -q 'FAIL'; then
              echo "frozen gate: named host-only skip (corpus absent in fresh clone) — accepted"
              exit 0
            fi
            echo "gates failed (rc=$rc)" >&2
            exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libbpf-dev bpftool
      - name: build object (CI identity — the sha256 pin is a human decision, enforced only after pinning)
        run: |
          make bpf
          make bpf-check
          printf 'CI object sha256: %s\n' "$(cut -d' ' -f1 probe/bpf/bpf_probe.o.sha256)"
      - name: upload object
        uses: actions/upload-artifact@v4
        with:
          name: bpf_probe.o
          path: |
            probe/bpf/bpf_probe.o
            probe/bpf/bpf_probe.o.sha256

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: build
        run: bun run build
      - name: vitest
        run: bun x vitest run

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --build-arg VERSION=ci -t cgo-ci .
      - name: smoke (version)
        run: docker run --rm --entrypoint /cgo cgo-ci version

  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
      - name: fresh-clone gate
        run: bash kit/test-fresh-clone.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gh-actions-gitleaks@v2
        with:
          args: detect --source=. --no-git -v --redact
