name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gates
        # --strict counts any named SKIP (e.g. frozen, corpus absent in a fresh
        # clone) as failure; it is never rewritten to green.
        run: sh .githooks/run-gates.sh --strict
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libbpf-dev linux-tools-generic
      - name: build object (CI identity — the sha256 pin is a human decision, enforced only after pinning)
        run: |
          make bpf
          make bpf-check
          printf 'CI object sha256: %s\n' "$(cut -d' ' -f1 probe/bpf/bpf_probe.o.sha256)"
      - name: upload object
        uses: actions/upload-artifact@v4
        with:
          name: bpf_probe.o
          path: |
            probe/bpf/bpf_probe.o
            probe/bpf/bpf_probe.o.sha256

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: build
        run: bun run build
      - name: vitest
        run: bun x vitest run

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f deploy/Dockerfile --build-arg VERSION=ci -t cgo-ci .
      - name: smoke (served container)
        # ENTRYPOINT already is `/cgo --serve`; --expose is required by the
        # non-loopback bind guard in cmd/cgo/expose.go (token provided below).
        run: |
          docker run -d --name cgo-ci-smoke -p 19090:9090 \
            -e CGO_API_TOKEN=ci-smoke-test-token-32-chars-minimum \
            cgo-ci --addr 0.0.0.0:9090 --tls=false --expose
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19090/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:19090/ -o /tmp/cgo-index.html
          grep -o '/assets/[^" ]*' /tmp/cgo-index.html | while read -r asset; do
            curl -fsS "http://127.0.0.1:19090${asset}" > /dev/null
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19090/api/results)
          test "$code" = 401
          docker rm -f cgo-ci-smoke

  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
      - name: fresh-clone gate
        run: bash kit/test-fresh-clone.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
