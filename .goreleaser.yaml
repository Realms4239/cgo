version: 2

project_name: meteolink

# un seul binaire — meteolink devient un alias embarqué (commande `cgo top`
# historique + wrapper de compat dans l'archive). Moins de surface, une
# seule toolchain, zéro divergence.
#
# cmd/cgo-gui est volontairement hors de ce pipeline : il porte
# `//go:build windows` + x/sys/windows et casse le cross-build Linux
# (panne pré-existante, cf. docs/VERIFY.md). Il vit dans son propre dépôt
# (voir docs/deploy.md § Chaîne d'approvisionnement).
builds:
  - id: cgo
    main: ./cmd/cgo
    binary: cgo
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
    ldflags:
      - -s -w -X main.version={{.Version}}
  # le wrapper meteolink re-exécute cgo — gardé comme binaire séparé pour
  # la compat npm/scripts existants. Pas de -X main.version : ce main
  # n'a pas de var version (le linker refuserait).
  - id: meteolink
    main: ./cmd/meteolink
    binary: meteolink
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
    ldflags:
      - -s -w

archives:
  - id: default
    # archive unique : cgo-<os>-<arch> contient cgo + meteolink + kit/
    formats: [tar.gz]
    name_template: "cgo-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - kit/*.example
      - kit/*.sh
      - kit/cgo-netctl
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOM CycloneDX par archive (un document par artefact, jamais : seul le
# graphe de dépendances hiérarchique compte - R5 CycloneDX). Les cinq
# modules purs (model, metrics, results, figures, qdisc) sont des
# bibliothèques sans binaire : leur SBOM est produit en CI depuis
# `modules/<nom>/go.mod` par le même syft et rattaché à la même release
# (voir docs/deploy.md § SBOM + SLSA). Limite R2 : les images OCI ne sont
# pas catalogables par ce pipe - l'image se documente par
# `syft <image>@<digest>` + `cosign attest` (voir docs/deploy.md).
sboms:
  - id: cyclonedx
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document", "--enrich", "all"]
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    artifacts: archive
  # SBOM par module pur : PAS d'entrée `sboms:` ici (choix I1).
  # Le pipe `sboms:` ne catalogue que les artefacts GoReleaser (les archives)
  # ; une entrée `artifacts: archive` avec un répertoire fixe `modules/<nom>`
  # tournerait une fois par archive et écraserait le même document. Les SBOM
  # des cinq modules purs sont donc produits en CI par la boucle
  # `for m in ... ; syft "modules/$m"` (docs/deploy.md § 7.3.1) : même format
  # CycloneDX, même release, aucun `goreleaser check` à valider ici.

# Signature du fichier de checksums uniquement (recommandé : on signe la
# somme, pas chaque archive). `cosign` sans clé (keyless OIDC, workflow
# hébergé) - c'est la brique SLSA L2 de cette release. Les tags git
# `<module>/v0.1.0` (ex. `model/v0.1.0`) sont signés par `git tag -s`
# (voir docs/deploy.md § Épingles + cutover).
signs:
  - id: cosign-checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# Digests des images OCI publiées : `dist/digests.txt` est l'ancre
# vérifiable par `gh attestation verify` et par `cosign verify`
# (SLSA L2 - voir docs/deploy.md). Jamais de tag mutable `:latest`.
docker_digest:
  name_template: "digests.txt"

changelog:
  sort: asc

release:
  draft: false
  header: |
    ## Meteolink {{ .Version }}

    - `cgo` — le binaire unique : dashboard + API + `cgo setup` + `cgo kit` + `cgo run` + `cgo tui`
    - `meteolink` — alias de compatibilité (re-exécute cgo)
    - `dist/*.sbom.json` — SBOM CycloneDX par archive (et par module pur en CI)
    - `checksums.txt` + `checksums.txt.sigstore.json` — somme SHA-256 signée cosign (SLSA L2)
    - `digests.txt` — digests OCI signés, épinglés jamais `:latest`
    - Tags `<module>/v0.1.0` par module (ex. `model/v0.1.0`, `metrics/v0.1.0`) — un tag signé = un contenu immuable (semver §3)

    Vérifiez les téléchargements avec `checksums.txt` (SHA-256) puis le
    bundle cosign, et la provenance avec `gh attestation verify`.
