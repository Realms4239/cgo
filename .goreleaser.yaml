version: 2

project_name: meteolink

# un seul binaire — meteolink devient un alias embarqué (commande `cgo top`
# historique + wrapper de compat dans l'archive). Moins de surface, une
# seule toolchain, zéro divergence.
builds:
  - id: cgo
    main: ./cmd/cgo
    binary: cgo
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
    ldflags:
      - -s -w -X main.version={{.Version}}
  # le wrapper meteolink re-exécute cgo — gardé comme binaire séparé pour
  # la compat npm/scripts existants (même archive, mêmes flags).
  - id: meteolink
    main: ./cmd/meteolink
    binary: meteolink
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    # archive unique : cgo-<os>-<arch> contient cgo + meteolink + kit/
    formats: [tar.gz]
    name_template: "cgo-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - kit/*.example
      - kit/*.sh
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc

release:
  draft: false
  header: |
    ## Meteolink {{ .Version }}

    - `cgo` — le binaire unique : dashboard + API + `cgo setup` + `cgo kit` + `cgo run` + `cgo tui`
    - `meteolink` — alias de compatibilité (re-exécute cgo)

    Vérifiez les téléchargements avec `checksums.txt` (SHA-256).
