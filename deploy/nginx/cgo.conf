limit_req_zone $binary_remote_addr zone=cgo_reads:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cgo_mutations:10m rate=1r/s;

server {
    listen 9090 ssl;
    server_name _;

    # TLS paths — mounted by the operator (NEVER committed here):
    #   ssl_certificate     /etc/nginx/certs/meteolink.crt
    #   ssl_certificate_key /etc/nginx/certs/meteolink.key   (0600)
    # Generate with the cgo setup (self-signed P-256) or your CA; see
    # docs/deploy.md § TLS. `nginx -t` must pass before reload.
    ssl_certificate     /etc/nginx/certs/meteolink.crt;
    ssl_certificate_key /etc/nginx/certs/meteolink.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # TLS termination is configured by the operator; see docs/deploy.md S1.
    limit_req_status 429;

    location /api/health {
        limit_req zone=cgo_reads burst=10 nodelay;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;
        limit_req zone=cgo_reads burst=10 nodelay;
        proxy_pass http://127.0.0.1:9090;
    }

    location /api/ {
        limit_req zone=cgo_mutations burst=3 nodelay;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=cgo_reads burst=10 nodelay;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
    }
}
