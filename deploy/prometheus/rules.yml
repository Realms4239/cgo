groups:
  - name: cgo-slo
    rules:
      # Seules les séries réellement émises par api/metrics.go sont citées ici.
      # Les anciennes règles (cgo_cap_sla_measured, cgo_audit_load_measured_total,
      # cgo_iface_valid) portaient sur des drapeaux codés en dur à 0 : retirées,
      # pas silencieuses — une série absente n'est jamais un zéro.
      - alert: CGO_metrics_absent
        expr: absent(cgo_build_info)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No CGO /metrics scrape - service down or unobserved"
      - alert: CGO_kernel_telemetry_degraded
        expr: cgo_kernel_source_info{source="tcpinfo"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kernel telemetry degraded to tcpinfo - eBPF unavailable"
