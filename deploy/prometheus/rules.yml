groups:
  - name: cgo-slo
    rules:
      # Limitées aux métriques effectivement émises par /metrics
      # (pkg/api/metrics.go) : les anciennes règles cgo_cap_deadline_ok_pct
      # et cgo_cap_sla_breach (jamais émises) ont été retirées.
      - alert: CGO_cap_sla_unmeasured
        expr: cgo_cap_sla_measured == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CAP SLA not measured - deadline objective unevaluated"
      - alert: CGO_probe_dead
        expr: rate(cgo_audit_load_measured_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No measured load in 10m - probes may be dead"
      - alert: CGO_iface_invalid
        expr: cgo_iface_valid == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Interface sampling invalid - numerics must be ignored"
