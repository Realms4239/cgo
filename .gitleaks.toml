# sont PAS l'affaire de ce scanner et ne sont PAS allowlistées (CRC : aucun).

title = "CGO gitleaks — legacy allowlist nommée uniquement"

[extend]
useDefault = true

[allowlist]
description = "Legacy allowlist nommée : 18 archives backup/ + results/runs-frozen.tar.gz (cf. cmd/gates/main.go) + 1 littéral faux positif documenté"
