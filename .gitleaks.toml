regexes = [
  # Faux positif documenté (controller, 2026-11-14) : CGO_BENCH=dualns est la
  # bascule de banc documentée dans docs/superpowers/plans/
  # 2026-10-25-cgo-plan2-bench-campaign.md ligne 259 — une assignation de
  # variable d'environnement, pas un credential (entropy 3.875, règle
  # generic-api-key). Autorisé par contenu, pas par chemin.
  '''CGO_BENCH=dualns''',
]
