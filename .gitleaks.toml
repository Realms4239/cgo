# nommée, identique à la porte hygiene du runner Go compilé
# (cmd/gates/main.go, `legacyArchives` + `allowedArtifacts`) :
#
#   18 archives backup/ suivies avant la règle « backup/ jamais commité » :
#     backup/runs-20260902-001002.tar.gz
#     backup/runs-20260903-232145.tar.gz
#     backup/runs-20260904-004749.tar.gz
#     backup/runs-20260904-024318.tar.gz
